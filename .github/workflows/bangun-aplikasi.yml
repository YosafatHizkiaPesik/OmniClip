# Membangun aplikasi desktop OmniClip untuk Windows dan Linux.
#
# Ada di sini karena tidak ada komputer Windows di meja: GitHub menyediakan
# satu, gratis dan tanpa batas untuk repositori publik. Menandai versi berarti
# mendapat .exe beberapa menit kemudian.
#
# Langkah yang menentukan adalah `--periksa`. Sebuah bundel bisa terbangun
# mulus dan tetap kehilangan satu pustaka biner atau satu berkas font, dan
# kehilangan seperti itu baru terlihat di mesin pengguna berminggu-minggu
# kemudian. Di sini bundel memeriksa dirinya sendiri, DI SISTEM YANG SAMA
# dengan yang akan memakainya, dan build yang tidak lengkap gagal di sini.

name: Bangun aplikasi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bangun:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nama: windows
            arsip: OmniClip-windows.zip
          - os: ubuntu-latest
            nama: linux
            arsip: OmniClip-linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Antarmuka harus dibangun LEBIH DULU: spec PyInstaller menyalin
      # frontend/dist ke dalam bundel, dan folder yang belum ada tidak akan
      # menggagalkan build — ia hanya menghasilkan aplikasi tanpa antarmuka.
      - name: Bangun antarmuka
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Pastikan antarmuka benar-benar terbangun
        shell: bash
        run: test -f frontend/dist/index.html

      # Tag dan app/version.py harus menyebut angka yang sama. Kalau tidak,
      # rilis v1.0.1 akan berisi aplikasi yang mengaku 1.0.0 — dan setiap
      # pemasangan akan menawarkan pembaruan yang sama, memasangnya, lalu
      # menawarkannya lagi, selamanya.
      - name: Cocokkan tag dengan nomor versi
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BERKAS=$(grep -oP '__version__\s*=\s*"\K[^"]+' backend/app/version.py)
          echo "tag=$TAG  version.py=$BERKAS"
          if [ "$TAG" != "$BERKAS" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak cocok dengan app/version.py ($BERKAS)."
            exit 1
          fi

      - name: Pasang dependensi Python
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      # Mengunduh ffmpeg statis DAN memeriksa isinya di sistem ini. Build gpl
      # tanpa libx264 terlihat persis seperti build yang benar sampai render
      # pertama gagal di mesin orang lain.
      - name: Ambil ffmpeg statis
        working-directory: backend
        run: python ../tools/ambil_ffmpeg.py

      - name: Bungkus
        working-directory: backend
        run: pyinstaller omniclip.spec --noconfirm --log-level WARN

      # Inilah gerbangnya. Kalau ada satu bagian yang hilang, kerjanya berhenti
      # di sini dan tidak ada berkas yang terbit.
      - name: Periksa kelengkapan bundel
        working-directory: backend
        shell: bash
        env:
          OMNICLIP_STORAGE: ${{ runner.temp }}/omniclip-periksa
        run: |
          if [ "${{ matrix.nama }}" = "windows" ]; then
            ./dist/OmniClip/OmniClip.exe --periksa
          else
            ./dist/OmniClip/OmniClip --periksa
          fi

      # Ditandatangani SEBELUM dikemas, dan hanya bila sertifikatnya ada.
      #
      # Tanpa tanda tangan, Windows Defender dan SmartScreen memperlakukan
      # berkas ini seperti program tak dikenal — yang memang benar secara
      # teknis. Langkah ini sengaja tidak mewajibkan sertifikat: selama
      # rahasianya belum dipasang, build tetap jalan dan hasilnya tetap
      # terbit, hanya tanpa tanda tangan. Lihat PANDUAN-TANDA-TANGAN.md.
      - name: Tanda tangani berkas Windows
        if: matrix.nama == 'windows' && env.PFX != ''
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_SANDI: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\omniclip.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                        -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match 'x64' } |
                       Select-Object -Last 1).FullName
          # Yang ditandatangani hanya berkas milik kita sendiri. Menandatangani
          # ulang .dll pihak ketiga yang sudah bertanda tangan sah justru
          # menghapus tanda tangan penerbit aslinya.
          & $signtool sign /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com `
            /f $pfx /p $env:PFX_SANDI `
            backend\dist\OmniClip\OmniClip.exe
          & $signtool verify /pa backend\dist\OmniClip\OmniClip.exe
          Remove-Item $pfx

      - name: Kemas
        shell: bash
        working-directory: backend/dist
        run: |
          if [ "${{ matrix.nama }}" = "windows" ]; then
            7z a -tzip "${{ matrix.arsip }}" OmniClip
          else
            tar czf "${{ matrix.arsip }}" OmniClip
          fi
          ls -la "${{ matrix.arsip }}"

      # Sidik SHA-256 diterbitkan bersama berkasnya. Ia tidak menggantikan
      # tanda tangan, tapi ia satu-satunya cara memastikan berkas yang diunduh
      # sama dengan yang dibangun di sini — termasuk saat seseorang melaporkan
      # "antivirus saya menghapusnya".
      - name: Sidik SHA-256
        shell: bash
        working-directory: backend/dist
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.arsip }}" > "${{ matrix.arsip }}.sha256"
          else
            shasum -a 256 "${{ matrix.arsip }}" > "${{ matrix.arsip }}.sha256"
          fi
          cat "${{ matrix.arsip }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniClip-${{ matrix.nama }}
          path: backend/dist/${{ matrix.arsip }}
          retention-days: 30

      - name: Terbitkan di Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend/dist/${{ matrix.arsip }}
            backend/dist/${{ matrix.arsip }}.sha256
          fail_on_unmatched_files: true
