# Membangun aplikasi desktop OmniClip untuk Windows dan Linux.
#
# Ada di sini karena tidak ada komputer Windows di meja: GitHub menyediakan
# satu, gratis dan tanpa batas untuk repositori publik. Menandai versi berarti
# mendapat .exe beberapa menit kemudian.
#
# Langkah yang menentukan adalah `--periksa`. Sebuah bundel bisa terbangun
# mulus dan tetap kehilangan satu pustaka biner atau satu berkas font, dan
# kehilangan seperti itu baru terlihat di mesin pengguna berminggu-minggu
# kemudian. Di sini bundel memeriksa dirinya sendiri, DI SISTEM YANG SAMA
# dengan yang akan memakainya, dan build yang tidak lengkap gagal di sini.

name: Bangun aplikasi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bangun:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nama: windows
            arsip: OmniClip-windows.zip
          - os: ubuntu-latest
            nama: linux
            arsip: OmniClip-linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Antarmuka harus dibangun LEBIH DULU: spec PyInstaller menyalin
      # frontend/dist ke dalam bundel, dan folder yang belum ada tidak akan
      # menggagalkan build — ia hanya menghasilkan aplikasi tanpa antarmuka.
      - name: Bangun antarmuka
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Pastikan antarmuka benar-benar terbangun
        shell: bash
        run: test -f frontend/dist/index.html

      # Tag dan app/version.py harus menyebut angka yang sama. Kalau tidak,
      # rilis v1.0.1 akan berisi aplikasi yang mengaku 1.0.0 — dan setiap
      # pemasangan akan menawarkan pembaruan yang sama, memasangnya, lalu
      # menawarkannya lagi, selamanya.
      - name: Cocokkan tag dengan nomor versi
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BERKAS=$(grep -oP '__version__\s*=\s*"\K[^"]+' backend/app/version.py)
          echo "tag=$TAG  version.py=$BERKAS"
          if [ "$TAG" != "$BERKAS" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak cocok dengan app/version.py ($BERKAS)."
            exit 1
          fi

      - name: Pasang dependensi Python
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      # Mengunduh ffmpeg statis DAN memeriksa isinya di sistem ini. Build gpl
      # tanpa libx264 terlihat persis seperti build yang benar sampai render
      # pertama gagal di mesin orang lain.
      - name: Ambil ffmpeg statis
        working-directory: backend
        run: python ../tools/ambil_ffmpeg.py

      - name: Bungkus
        working-directory: backend
        run: pyinstaller omniclip.spec --noconfirm --log-level WARN

      # Inilah gerbangnya. Kalau ada satu bagian yang hilang, kerjanya berhenti
      # di sini dan tidak ada berkas yang terbit.
      - name: Periksa kelengkapan bundel
        working-directory: backend
        shell: bash
        env:
          OMNICLIP_STORAGE: ${{ runner.temp }}/omniclip-periksa
        run: |
          if [ "${{ matrix.nama }}" = "windows" ]; then
            ./dist/OmniClip/OmniClip.exe --periksa
          else
            ./dist/OmniClip/OmniClip --periksa
          fi

      - name: Kemas
        shell: bash
        working-directory: backend/dist
        run: |
          if [ "${{ matrix.nama }}" = "windows" ]; then
            7z a -tzip "${{ matrix.arsip }}" OmniClip
          else
            tar czf "${{ matrix.arsip }}" OmniClip
          fi
          ls -la "${{ matrix.arsip }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniClip-${{ matrix.nama }}
          path: backend/dist/${{ matrix.arsip }}
          retention-days: 30

      - name: Terbitkan di Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/${{ matrix.arsip }}
          fail_on_unmatched_files: true
